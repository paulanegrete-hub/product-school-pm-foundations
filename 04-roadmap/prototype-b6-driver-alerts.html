<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity Driver Alerts</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --fill: #f2f2f4; --text: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6;
    --line: #e6e6eb; --ink: #0b1f33; --ink-text: #ffffff; --accent: #0a64d8;
    --sent: #0a64d8; --delivered: #c27c00; --confirmed: #1f9d55; --flag: #d92d20; --idle: #c7c7cc;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --surface: #111113; --fill: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --faint: #636366;
      --line: #2c2c2e; --ink: #f5f5f7; --ink-text: #000; --accent: #4c9bff;
      --sent: #4c9bff; --delivered: #f0b13c; --confirmed: #34c759; --flag: #ff6b5e; --idle: #48484a;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000; --surface: #111113; --fill: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --faint: #636366;
    --line: #2c2c2e; --ink: #f5f5f7; --ink-text: #000; --accent: #4c9bff;
    --sent: #4c9bff; --delivered: #f0b13c; --confirmed: #34c759; --flag: #ff6b5e; --idle: #48484a;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", sans-serif; letter-spacing: -.005em; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: not-allowed; opacity: .35; }
  button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 48px 24px 64px; }

  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 40px; }
  .brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; margin-bottom: 10px; }
  .brand svg { color: var(--text); }
  h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 650; letter-spacing: -.025em; }
  .sub { margin: 10px 0 0; color: var(--muted); font-size: 17px; letter-spacing: -.01em; }
  .controls { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 13px; }
  .link { color: var(--accent); font-weight: 500; }
  .link.muted { color: var(--muted); }
  .link.danger { color: var(--flag); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 32px; align-items: start; }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 20px; }
  .metric { padding: 0 20px; border-left: 1px solid var(--line); }
  .metric:first-child { padding-left: 0; border-left: 0; }
  .metric .v { font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .metric .k { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .metric .v.flag { color: var(--flag); }

  .surface { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
  .board { padding: 8px 24px 4px; }
  .board-head { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 10px; }
  .board-head h2, .section-title { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .board-head span { color: var(--muted); font-size: 12.5px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--faint); font-weight: 500; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 16px 12px 16px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.selected td { background: linear-gradient(var(--fill), var(--fill)); }
  tr.selected td:first-child { box-shadow: -24px 0 0 var(--fill); }
  .primary-text { font-weight: 500; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .code { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; letter-spacing: 0; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; }
  .s-sent .dot { background: var(--sent); }
  .s-delivered .dot { background: var(--delivered); }
  .s-confirmed .dot { background: var(--confirmed); }
  .s-idle { color: var(--muted); font-weight: 400; }
  .flag-text { color: var(--flag); font-size: 12.5px; font-weight: 500; margin-top: 3px; }
  .row-actions { display: flex; gap: 16px; justify-content: flex-end; white-space: nowrap; }

  .sheet { margin: 4px 0 20px; padding: 20px; background: var(--fill); border-radius: 14px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  .sheet-head b { font-size: 15px; font-weight: 600; }
  .sheet-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; align-items: end; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field .static { padding: 9px 0; font-weight: 500; }
  select { width: 100%; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .btn { background: var(--ink); color: var(--ink-text); border-radius: 999px; padding: 10px 18px; font-weight: 500; white-space: nowrap; }
  .notice { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .notice.error { color: var(--flag); }

  details.quiet { margin-top: 28px; }
  details.quiet summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; }
  details.quiet summary::-webkit-details-marker { display: none; }
  details.quiet summary .hint { color: var(--muted); font-size: 12.5px; }
  details.quiet summary .hint::after { content: " ›"; }
  details.quiet[open] summary .hint::after { content: " ⌄"; }
  .log { list-style: none; margin: 12px 0 0; padding: 0; max-height: 220px; overflow: auto; }
  .log li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .log time { color: var(--faint); }

  .side { position: sticky; top: 24px; }
  .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 10px; padding: 2px; margin-bottom: 20px; }
  .segmented button { padding: 6px 0; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted); position: relative; }
  .segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .segmented .badge-dot { position: absolute; top: 6px; right: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--sent); }

  .phone { width: 300px; height: 620px; margin: 0 auto; border-radius: 52px; padding: 12px; background: #1a1a1c; box-shadow: 0 0 0 1px #3a3a3c, 0 30px 60px rgba(0,0,0,.18); }
  .screen { position: relative; height: 100%; border-radius: 40px; overflow: hidden; display: flex; flex-direction: column; }
  .island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 92px; height: 26px; border-radius: 20px; background: #000; z-index: 2; }
  .sbar { display: flex; justify-content: space-between; padding: 15px 26px 0; font-size: 13px; font-weight: 600; height: 44px; }
  .lock { background: radial-gradient(120% 70% at 50% 0%, #1d3557 0%, #0b1f33 55%, #050d16 100%); color: #fff; }
  .lock .date { text-align: center; font-size: 15px; font-weight: 500; opacity: .85; margin-top: 18px; }
  .lock .time { text-align: center; font-size: 76px; font-weight: 600; letter-spacing: -.03em; line-height: 1; margin-bottom: 26px; }
  .notifs { padding: 0 12px; overflow: auto; }
  .notif { display: block; width: 100%; text-align: left; border-radius: 20px; padding: 11px 14px; margin-bottom: 8px;
    background: rgba(255,255,255,.16); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; }
  .notif.outdated { opacity: .5; }
  .notif .top { display: flex; justify-content: space-between; font-size: 12px; opacity: .75; }
  .notif .top span:first-child { font-weight: 600; letter-spacing: .02em; text-transform: uppercase; font-size: 11px; }
  .notif .msg { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .notif .sub2 { font-size: 13px; opacity: .85; }
  .lock .empty { text-align: center; font-size: 13px; opacity: .5; margin-top: 20px; }
  .lock .nosignal { margin: 0 12px 10px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.1); font-size: 12.5px; text-align: center; }

  .app { background: #fff; color: #1d1d1f; }
  .app .sbar { color: #1d1d1f; }
  .app-nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 20px 4px; }
  .app-nav button { color: #0a64d8; font-size: 15px; }
  .app-nav .code { color: #6e6e73; }
  .app h3 { margin: 4px 20px 2px; font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
  .app .lede { margin: 0 20px 16px; color: #6e6e73; font-size: 13.5px; }
  .app .note-bar { margin: 0 20px 14px; padding: 9px 12px; border-radius: 12px; background: #f2f2f4; font-size: 12.5px; color: #3a3a3c; }
  .timeline { list-style: none; margin: 0; padding: 0 20px; position: relative; }
  .timeline li { position: relative; padding: 0 0 18px 26px; }
  .timeline li::before { content: ""; position: absolute; left: 5px; top: 14px; bottom: -4px; width: 2px; background: #e6e6eb; }
  .timeline li:last-child::before { display: none; }
  .timeline .pin { position: absolute; left: 0; top: 3px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #c7c7cc; background: #fff; }
  .timeline .label { font-size: 11px; color: #a1a1a6; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
  .timeline .name { font-size: 15px; font-weight: 600; }
  .timeline .addr { font-size: 12.5px; color: #6e6e73; }
  .timeline li.old .name { text-decoration: line-through; color: #a1a1a6; font-weight: 500; }
  .timeline li.old .pin { border-color: #e6e6eb; }
  .timeline li.new .pin { border-color: #0a64d8; background: #0a64d8; box-shadow: 0 0 0 4px rgba(10,100,216,.15); }
  .timeline li.done .pin { border-color: #1f9d55; background: #1f9d55; }
  .app-foot { margin-top: auto; padding: 12px 16px 22px; }
  .cta { width: 100%; padding: 16px; border-radius: 16px; background: #0b1f33; color: #fff; font-size: 16px; font-weight: 600; }
  .state { text-align: center; font-size: 14px; font-weight: 500; color: #1f9d55; padding: 14px 0; }
  .state.waiting { color: #6e6e73; }
  .home-bar { width: 110px; height: 4px; border-radius: 4px; background: currentColor; opacity: .35; margin: 6px auto 8px; }

  .switch-row { display: flex; justify-content: space-between; align-items: center; margin: 22px 4px 0; font-size: 13px; color: var(--muted); }
  .switch { width: 44px; height: 26px; border-radius: 999px; background: var(--idle); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--confirmed); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }

  .scenarios { margin-top: 28px; }
  .scenarios ol { margin: 12px 0 0; padding: 0; list-style: none; counter-reset: s; }
  .scenarios li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .scenarios li::before { content: counter(s); color: var(--faint); font-variant-numeric: tabular-nums; }
  .scenarios b { color: var(--text); font-weight: 500; }

  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
    .side { position: static; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 32px 16px 48px; }
    h1 { font-size: 32px; }
    .metrics { grid-template-columns: 1fr; gap: 14px; }
    .metric { padding: 0; border-left: 0; }
    .board { padding: 4px 16px; }
    .sheet-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const DELIVERY_MS = 1500;          // FR1: push lands well under 5 s
const FLAG_MS = 2 * 60 * 1000;     // unconfirmed re-routes flagged at 2 min

const STOPS = [
  { id: "s1", name: "Northgate Mall Dock", address: "1200 Harbor Rd" },
  { id: "s2", name: "Cedar St Pharmacy", address: "48 Cedar St" },
  { id: "s3", name: "Riverside Clinic", address: "310 River Ave" },
  { id: "s4", name: "Westfield Depot", address: "9 Industrial Way" },
  { id: "s5", name: "Elm Grocery", address: "77 Elm St" },
  { id: "s6", name: "Lakeview Hotel", address: "2 Shore Blvd" },
  { id: "s7", name: "Depot 9", address: null }
];
const stop = id => STOPS.find(s => s.id === id);

const initialWorld = () => ({
  seq: 1,
  drivers: [
    { id: "d1", name: "Ana Ruiz", vehicle: "VAN-12", route: "R-101", online: true, stops: ["s1", "s2", "s5"], reroute: null, inbox: [] },
    { id: "d2", name: "Luis Pérez", vehicle: "TRK-07", route: "R-102", online: false, stops: ["s4", "s3", "s6"], reroute: null, inbox: [] },
    { id: "d3", name: "Marta Gómez", vehicle: "VAN-03", route: "R-103", online: true, stops: ["s3", "s5", "s1"], reroute: null, inbox: [] },
    { id: "d4", name: "Diego Salas", vehicle: "VAN-21", route: "R-104", online: true, stops: ["s6", "s2", "s4"], reroute: null, inbox: [] },
    { id: "u1", name: null, vehicle: null, route: "R-106", online: false, stops: ["s5", "s6"], reroute: null, inbox: [] }
  ],
  log: [{ t: Date.now(), text: "Pilot board loaded · 4 drivers, 1 unassigned route" }]
});

const fmtClock = t => new Date(t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const fmtHM = t => new Date(t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const fmtDur = ms => { const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const pending = r => r && (r.status === "sent" || r.status === "delivered");

const RouteMark = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="5" cy="18" r="2.5" stroke="currentColor" strokeWidth="2" />
    <circle cx="19" cy="6" r="2.5" stroke="currentColor" strokeWidth="2" />
    <path d="M7.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" />
  </svg>
);

function App() {
  const [world, setWorld] = useState(initialWorld);
  const [offset, setOffset] = useState(0);
  const [, setTick] = useState(0);
  const [selected, setSelected] = useState(null);
  const [newStop, setNewStop] = useState("");
  const [error, setError] = useState("");
  const [phoneId, setPhoneId] = useState("d1");
  const [screen, setScreen] = useState("lock");
  const [banner, setBanner] = useState("");

  useEffect(() => { const i = setInterval(() => setTick(t => t + 1), 1000); return () => clearInterval(i); }, []);
  const now = Date.now() + offset;

  const updateDriver = (w, id, fn) => ({ ...w, drivers: w.drivers.map(d => d.id === id ? fn(d) : d) });
  const addLog = (w, t, text) => ({ ...w, log: [{ t, text }, ...w.log] });

  // Simulated push delivery: only lands if this re-route is still the live one and the device is online
  const scheduleDelivery = (driverId, rerouteId, deliveredAt) => {
    setTimeout(() => setWorld(w => {
      const d = w.drivers.find(x => x.id === driverId);
      if (!d || !d.online || !d.reroute || d.reroute.id !== rerouteId || d.reroute.status !== "sent") return w;
      const r = d.reroute;
      let next = updateDriver(w, driverId, x => ({
        ...x,
        reroute: { ...r, status: "delivered", deliveredAt },
        inbox: [{ id: `n${w.seq}`, rerouteId, kind: "reroute", title: "Route changed", text: `New next stop: ${stop(r.newStop).name}`, at: deliveredAt, outdated: false }, ...x.inbox]
      }));
      next = { ...next, seq: w.seq + 1 };
      return addLog(next, deliveredAt, `${r.id} delivered to ${d.name}`);
    }), DELIVERY_MS);
  };

  const sendReroute = (driverId, stopId) => {
    setError("");
    const d = world.drivers.find(x => x.id === driverId);
    const s = stop(stopId);
    if (!d.name) return;
    if (!s) { setError("Choose a new stop first."); return; }
    if (!s.address) {
      setError("Stop data missing. This stop has no address in the route record, so no alert was sent.");
      setWorld(w => addLog(w, now, `Blocked · ${s.name} has no address · nothing sent to ${d.name}`));
      return;
    }
    const t = now;
    const id = `RR-${String(world.seq).padStart(3, "0")}`;
    setWorld(w => {
      const cur = w.drivers.find(x => x.id === driverId);
      const prev = cur.reroute;
      let next = updateDriver(w, driverId, x => ({
        ...x,
        reroute: { id, oldStop: x.stops[0], newStop: stopId, status: "sent", sentAt: t },
        inbox: x.inbox.map(n => n.kind === "reroute" ? { ...n, outdated: true } : n)
      }));
      next = { ...next, seq: w.seq + 1 };
      if (pending(prev)) next = addLog(next, t, `${prev.id} replaced by ${id} · driver sees only the latest route`);
      return addLog(next, t, `${id} sent to ${cur.name} · ${stop(cur.stops[0]).name} → ${s.name}`);
    });
    if (d.online) scheduleDelivery(driverId, id, t + DELIVERY_MS);
    setSelected(null);
    setNewStop("");
  };

  const resend = driverId => sendReroute(driverId, world.drivers.find(x => x.id === driverId).reroute.newStop);

  const cancel = driverId => {
    const t = now;
    setWorld(w => {
      const d = w.drivers.find(x => x.id === driverId);
      let next = updateDriver(w, driverId, x => ({
        ...x,
        reroute: { ...x.reroute, status: "cancelled", cancelledAt: t },
        inbox: [{ id: `n${w.seq}`, kind: "cancel", title: "Route change cancelled", text: "Keep your current route", at: t }, ...x.inbox.map(n => n.kind === "reroute" ? { ...n, outdated: true } : n)]
      }));
      next = { ...next, seq: w.seq + 1 };
      return addLog(next, t, `${d.reroute.id} cancelled by coordinator`);
    });
  };

  const confirm = driverId => {
    const t = now;
    setWorld(w => {
      const d = w.drivers.find(x => x.id === driverId);
      const r = d.reroute;
      if (!r || r.status !== "delivered") return w;
      const next = updateDriver(w, driverId, x => ({
        ...x,
        stops: [r.newStop, ...x.stops.slice(1)],
        reroute: { ...r, status: "confirmed", confirmedAt: t },
        inbox: x.inbox.map(n => n.rerouteId === r.id ? { ...n, done: true } : n)
      }));
      return addLog(next, t, `${r.id} confirmed by ${d.name} in ${fmtDur(t - r.sentAt)}`);
    });
  };

  const setOnline = (driverId, online) => {
    const t = now;
    const d = world.drivers.find(x => x.id === driverId);
    setWorld(w => addLog(updateDriver(w, driverId, x => ({ ...x, online })), t, `${d.name}'s phone ${online ? "back online" : "lost signal"}`));
    if (online && d.reroute && d.reroute.status === "sent") scheduleDelivery(driverId, d.reroute.id, t + DELIVERY_MS);
  };

  const openNotif = n => {
    const d = world.drivers.find(x => x.id === phoneId);
    if (n.kind !== "cancel" && (n.outdated || (d.reroute && n.rerouteId !== d.reroute.id))) setBanner("This route was updated. Showing the latest version.");
    else setBanner("");
    setScreen("route");
  };

  const reset = () => { setWorld(initialWorld()); setOffset(0); setSelected(null); setNewStop(""); setError(""); setScreen("lock"); setBanner(""); };

  const confirmedTimes = world.drivers.filter(d => d.reroute && d.reroute.status === "confirmed").map(d => d.reroute.confirmedAt - d.reroute.sentAt);
  const avg = confirmedTimes.length ? confirmedTimes.reduce((a, b) => a + b, 0) / confirmedTimes.length : null;
  const flagged = world.drivers.filter(d => pending(d.reroute) && now - d.reroute.sentAt >= FLAG_MS).length;
  const awaiting = world.drivers.filter(d => pending(d.reroute)).length;

  const selDriver = world.drivers.find(d => d.id === selected);
  const phoneDriver = world.drivers.find(d => d.id === phoneId);

  return (
    <div className="wrap">
      <header>
        <div>
          <div className="brand"><RouteMark /> RouteLogic Velocity</div>
          <h1>Driver Alerts</h1>
          <p className="sub">A re-route reaches the driver in seconds. Confirmed in one tap.</p>
        </div>
        <div className="controls">
          <span className="num">{fmtClock(now)}</span>
          <button className="link" onClick={() => setOffset(o => o + FLAG_MS)}>Skip 2 min</button>
          <button className="link muted" onClick={reset}>Reset</button>
        </div>
      </header>

      <div className="grid">
        <main>
          <div className="metrics">
            <div className="metric"><div className="v num">{awaiting}</div><div className="k">Awaiting confirmation</div></div>
            <div className="metric"><div className={`v num ${flagged ? "flag" : ""}`}>{flagged}</div><div className="k">Not confirmed after 2 min</div></div>
            <div className="metric"><div className="v num">{avg === null ? "—" : fmtDur(avg)}</div><div className="k">Send → confirm · target 0:30</div></div>
          </div>

          <section className="surface board">
            <div className="board-head"><h2>Live Dispatch</h2><span>Pilot account · live</span></div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Driver</th><th>Next stop</th><th>Re-route</th><th></th></tr></thead>
                <tbody>
                  {world.drivers.map(d => {
                    const r = d.reroute;
                    const isFlagged = pending(r) && now - r.sentAt >= FLAG_MS;
                    const label = !r ? "—" : r.status === "sent" ? "Sent" : r.status === "delivered" ? "Delivered" : r.status === "confirmed" ? `Confirmed in ${fmtDur(r.confirmedAt - r.sentAt)}` : "Cancelled";
                    const cls = !r || r.status === "cancelled" ? "s-idle" : `s-${r.status}`;
                    return (
                      <React.Fragment key={d.id}>
                        <tr className={selected === d.id ? "selected" : ""}>
                          <td>
                            <div className="primary-text">{d.name || "Unassigned"}</div>
                            <div className="meta"><span className="code">{d.route}{d.vehicle ? ` · ${d.vehicle}` : ""}</span>{d.name && !d.online ? " · No signal" : ""}</div>
                          </td>
                          <td>
                            <div className="primary-text">{stop(d.stops[0]).name}</div>
                            <div className="meta">{stop(d.stops[0]).address}</div>
                          </td>
                          <td>
                            <span className={`status ${cls}`}>{r && r.status !== "cancelled" && <span className="dot" />}{label}</span>
                            {r && r.status !== "cancelled" && (
                              <div className="meta num">
                                <span className="code">{r.id}</span> · to {stop(r.newStop).name}
                                {pending(r) ? ` · ${fmtDur(now - r.sentAt)}` : ""}
                              </div>
                            )}
                            {isFlagged && <div className="flag-text">Not confirmed</div>}
                          </td>
                          <td>
                            <div className="row-actions">
                              {isFlagged && <button className="link" onClick={() => resend(d.id)}>Resend</button>}
                              {pending(r) && <button className="link danger" onClick={() => cancel(d.id)}>Cancel</button>}
                              <button className="link" onClick={() => { setSelected(selected === d.id ? null : d.id); setNewStop(""); setError(""); }}>Re-route</button>
                            </div>
                          </td>
                        </tr>
                        {selDriver && selDriver.id === d.id && (
                          <tr><td colSpan="4" style={{ padding: 0, borderBottom: 0 }}>
                            <div className="sheet">
                              <div className="sheet-head"><b>Re-route {d.name || d.route}</b><button className="link muted" onClick={() => { setSelected(null); setError(""); }}>Close</button></div>
                              <div className="sheet-grid">
                                <div className="field"><label>Current next stop</label><div className="static">{stop(d.stops[0]).name}</div></div>
                                <div className="field">
                                  <label htmlFor="newstop">New next stop</label>
                                  <select id="newstop" value={newStop} onChange={e => { setNewStop(e.target.value); setError(""); }}>
                                    <option value="">Choose a stop</option>
                                    {STOPS.filter(s => s.id !== d.stops[0]).map(s => (
                                      <option key={s.id} value={s.id}>{s.name}{s.address ? ` · ${s.address}` : " · no address"}</option>
                                    ))}
                                  </select>
                                </div>
                                <button className="btn" disabled={!d.name || !newStop} onClick={() => sendReroute(d.id, newStop)}>Send to driver</button>
                              </div>
                              {!d.name && <div className="notice">Assign a driver first.</div>}
                              {d.name && pending(r) && <div className="notice">{r.id} is still pending. Sending replaces it.</div>}
                              {error && <div className="notice error">{error}</div>}
                            </div>
                          </td></tr>
                        )}
                      </React.Fragment>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </section>

          <details className="quiet" open>
            <summary><span className="section-title">Activity</span><span className="hint">Every status change, timestamped</span></summary>
            <ol className="log">{world.log.map((l, i) => <li key={i}><time className="num">{fmtClock(l.t)}</time><span>{l.text}</span></li>)}</ol>
          </details>
        </main>

        <aside className="side">
          <div className="segmented" role="group" aria-label="Driver phone">
            {world.drivers.filter(d => d.name).map(d => (
              <button key={d.id} aria-pressed={phoneId === d.id} onClick={() => { setPhoneId(d.id); setScreen("lock"); setBanner(""); }}>
                {d.name.split(" ")[0]}
                {phoneId !== d.id && d.inbox.some(n => !n.outdated && !n.done && n.kind === "reroute") && <span className="badge-dot" />}
              </button>
            ))}
          </div>

          <Phone d={phoneDriver} now={now} screen={screen} banner={banner}
            onOpen={openNotif} onBack={() => { setScreen("lock"); setBanner(""); }} onConfirm={() => confirm(phoneDriver.id)} />

          <div className="switch-row">
            <span>Cellular signal</span>
            <button className="switch" role="switch" aria-checked={phoneDriver.online} aria-label={`${phoneDriver.name}'s phone signal`}
              onClick={() => setOnline(phoneDriver.id, !phoneDriver.online)} />
          </div>

          <details className="quiet scenarios">
            <summary><span className="section-title">Walkthrough</span><span className="hint">6 scenarios</span></summary>
            <ol>
              <li><span><b>Happy path.</b> Re-route Ana, tap her alert, confirm.</span></li>
              <li><span><b>No signal.</b> Re-route Luis, skip 2 min, then resend or turn signal on.</span></li>
              <li><span><b>Conflicting changes.</b> Re-route Marta twice, open the older alert.</span></li>
              <li><span><b>Safety guard.</b> Pick Depot 9, which has no address.</span></li>
              <li><span><b>Unassigned.</b> Open R-106. Sending is disabled.</span></li>
              <li><span><b>Wrong driver.</b> Re-route Diego, then cancel.</span></li>
            </ol>
          </details>
        </aside>
      </div>
    </div>
  );
}

function Phone({ d, now, screen, banner, onOpen, onBack, onConfirm }) {
  const r = d.reroute;
  const date = new Date(now).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const Bar = () => <div className="sbar"><span className="num">{fmtHM(now)}</span><span>{d.online ? "5G" : "No Service"}</span></div>;

  if (screen === "lock") return (
    <div className="phone"><div className="screen lock">
      <div className="island" /><Bar />
      <div className="date">{date}</div>
      <div className="time num">{fmtHM(now)}</div>
      {!d.online && <div className="nosignal">No service. Alerts arrive when the phone reconnects.</div>}
      <div className="notifs">
        {d.inbox.length === 0 && <div className="empty">No notifications</div>}
        {d.inbox.map(n => (
          <button key={n.id} className={`notif ${n.outdated ? "outdated" : ""}`} onClick={() => onOpen(n)}>
            <div className="top"><span>RouteLogic</span><span className="num">{n.done ? "Confirmed" : n.outdated ? "Superseded" : fmtHM(n.at)}</span></div>
            <div className="msg">{n.title}</div>
            <div className="sub2">{n.text}</div>
          </button>
        ))}
      </div>
      <div style={{ marginTop: "auto" }}><div className="home-bar" /></div>
    </div></div>
  );

  const reviewing = r && r.status === "delivered";
  return (
    <div className="phone"><div className="screen app">
      <div className="island" /><Bar />
      <div className="app-nav"><button onClick={onBack}>‹ Alerts</button><span className="code">{d.route} · {d.vehicle}</span></div>
      <h3>{reviewing ? "New route" : "Your route"}</h3>
      <p className="lede">{reviewing ? "Your next stop changed." : r && r.status === "cancelled" ? "The change was cancelled. Keep your current route." : `${d.stops.length} stops remaining`}</p>
      {banner && <div className="note-bar">{banner}</div>}
      <ol className="timeline">
        {reviewing && (
          <>
            <li className="old"><span className="pin" /><div className="label">Previous</div><div className="name">{stop(r.oldStop).name}</div></li>
            <li className="new"><span className="pin" /><div className="label">Next stop</div><div className="name">{stop(r.newStop).name}</div><div className="addr">{stop(r.newStop).address}</div></li>
            {d.stops.slice(1).map(id => <li key={id}><span className="pin" /><div className="label">Then</div><div className="name">{stop(id).name}</div><div className="addr">{stop(id).address}</div></li>)}
          </>
        )}
        {!reviewing && d.stops.map((id, i) => (
          <li key={id} className={i === 0 ? (r && r.status === "confirmed" ? "done" : "new") : ""}>
            <span className="pin" /><div className="label">{i === 0 ? "Next stop" : "Then"}</div><div className="name">{stop(id).name}</div><div className="addr">{stop(id).address}</div>
          </li>
        ))}
      </ol>
      <div className="app-foot">
        {reviewing && <button className="cta" onClick={onConfirm}>Confirm new route</button>}
        {r && r.status === "confirmed" && <div className="state">Confirmed · dispatcher notified</div>}
        {r && r.status === "sent" && <div className="state waiting">Waiting for the update…</div>}
        <div className="home-bar" style={{ color: "#1d1d1f" }} />
      </div>
    </div></div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
